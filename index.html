
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>I miei soldi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#17191d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 18px 40px}
.app{max-width:480px;margin:auto}
.total{text-align:center;padding:35px 10px 30px}
.label{font-size:13px;color:#777;font-weight:600;letter-spacing:1px}
.amount{font-size:40px;font-weight:750;letter-spacing:-1.5px;margin-top:12px;overflow-wrap:anywhere}
h2{font-size:19px;margin:12px 0 16px}
.account{background:white;border-radius:18px;padding:17px;margin-bottom:12px;display:flex;align-items:center;gap:13px;box-shadow:0 2px 10px #00000006;cursor:pointer}
.dot{width:12px;height:46px;border-radius:8px;flex-shrink:0}
.details{flex:1;min-width:0}
.name{font-size:15px;font-weight:650;overflow-wrap:anywhere}
.balance{font-size:18px;font-weight:700;margin-top:5px;overflow-wrap:anywhere}
button{cursor:pointer;font:inherit}
.add{width:100%;border:0;border-radius:15px;padding:16px;background:#17191d;color:white;font-weight:650;font-size:15px;margin-top:7px}
.transfer{background:#3978E8;margin-top:10px}
.income{background:#18A779;margin-top:10px}
.form{display:none;background:white;border-radius:18px;padding:18px;margin-top:15px}
.form h2{margin:0 0 18px}
label{display:block;font-size:13px;color:#666;margin:14px 0 7px}
input,select{width:100%;border:1px solid #dddfe4;border-radius:11px;padding:13px;font-size:16px;background:white;color:#17191d}
.colors{display:flex;gap:11px;flex-wrap:wrap;margin-top:10px}
.color{width:30px;height:30px;border-radius:50%;border:3px solid white;outline:1px solid #ddd}
.color.selected{outline:3px solid #17191d}
.formbuttons{display:flex;gap:10px;margin-top:20px}
.formbuttons button{flex:1;border:0;border-radius:11px;padding:13px;font-weight:600}
.save{background:#17191d;color:white}
.cancel{background:#f0f1f4}
.empty{text-align:center;color:#777;font-size:14px;padding:25px 10px}
.history{margin-top:28px}
.historyHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.historyHead h2{margin:0}
.more{border:0;background:transparent;color:#3978E8;font-size:14px;font-weight:600;padding:8px 0}
.transferRow{background:white;border-radius:14px;padding:15px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:9px;box-shadow:0 2px 10px #00000006}
.transferName{font-size:14px;font-weight:650;overflow-wrap:anywhere;min-width:0}
.transferMiddle{display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.transferAmount{font-size:14px;font-weight:700}
.movementDate{font-size:11px;color:#888;font-weight:400;margin-top:5px}
.detailBalance{font-size:30px;font-weight:750;margin:10px 0 20px;overflow-wrap:anywhere}
.detailActions{display:flex;gap:10px;margin-top:18px}
.detailActions button{flex:1;border:0;border-radius:11px;padding:13px;font-weight:600;background:#f0f1f4}
.detailActions .delete{background:#FCE8E8;color:#B42318}
</style>
</head>
<body>
<div class="app">
  <div class="total">
    <div class="label">PATRIMONIO TOTALE</div>
    <div class="amount" id="total">€ 0,00</div>
  </div>

  <h2>I miei conti</h2>
  <div id="accounts"></div>

  <div class="form" id="accountDetail">
    <h2 id="detailName">Dettagli conto</h2>
    <div class="label">SALDO ATTUALE</div>
    <div class="detailBalance" id="detailBalance">€ 0,00</div>
    <div class="detailActions">
      <button onclick="editSelectedAccount()">Modifica</button>
      <button class="delete" onclick="deleteSelectedAccount()">Elimina</button>
    </div>
    <div class="formbuttons">
      <button class="cancel" onclick="closeAccountDetail()">Chiudi</button>
    </div>
  </div>

  <button class="add" onclick="newAccount()">+ Aggiungi un conto</button>
  <button class="add income" onclick="openIncome()">+ Aggiungi movimento</button>
  <button class="add transfer" onclick="openTransfer()">⇄ Trasferisci tra conti</button>

  <div class="form" id="transferForm">
    <h2>Trasferimento</h2>

    <label for="from">Da quale conto</label>
    <select id="from"></select>

    <label for="to">A quale conto</label>
    <select id="to"></select>

    <label for="transferAmount">Importo da trasferire (€)</label>
    <input id="transferAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00">

    <div class="formbuttons">
      <button class="cancel" onclick="closeTransfer()">Annulla</button>
      <button class="save" onclick="saveTransfer()">Trasferisci</button>
    </div>
  </div>

  <div class="form" id="incomeForm">
    <h2>Nuovo movimento</h2>

    <label for="movementType">Tipo di movimento</label>
    <select id="movementType">
      <option value="income">Entrata</option>
      <option value="expense">Uscita</option>
    </select>

    <label for="incomeAccount">Su quale conto</label>
    <select id="incomeAccount"></select>

    <label for="incomeAmount">Importo (€)</label>
    <input id="incomeAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00">

    <label for="incomeDescription">Descrizione</label>
    <input id="incomeDescription" maxlength="80" placeholder="Es. Stipendio, spesa, bolletta">

    <div class="formbuttons">
      <button class="cancel" onclick="closeIncome()">Annulla</button>
      <button class="save" onclick="saveIncome()">Salva movimento</button>
    </div>
  </div>

  <div class="history">
    <div class="historyHead">
      <h2>Ultimi movimenti</h2>
      <button class="more" id="showMore" onclick="toggleTransfers()">Mostra altro</button>
    </div>
    <div id="transferHistory"></div>
  </div>

  <div class="form" id="form">
    <h2 id="formTitle">Nuovo conto</h2>
    <label for="name">Nome del conto</label>
    <input id="name" placeholder="Es. Intesa, Poste, Contanti" maxlength="50">

    <label for="balance">Saldo attuale (€)</label>
    <input id="balance" type="number" inputmode="decimal" step="0.01" placeholder="0,00">

    <label>Colore del conto</label>
    <div class="colors" id="colors"></div>

    <div class="formbuttons">
      <button class="cancel" onclick="closeForm()">Annulla</button>
      <button class="save" onclick="saveAccount()">Salva</button>
    </div>
  </div>
</div>

<script>
const palette = [
  "#3978E8","#18A779","#9659D8","#F19A38",
  "#E05260","#16A6B6","#6B7280","#D3A72F"
];

let accounts = [];
let transfers = [];
let incomes = [];
let editingId = null;
let selectedAccountId = null;
let selectedColor = palette[0];
let showAllTransfers = false;

try {
  accounts = JSON.parse(localStorage.getItem("rendiconto_conti")) || [];
  if (!Array.isArray(accounts)) accounts = [];
} catch (e) {
  accounts = [];
}

try {
  transfers = JSON.parse(localStorage.getItem("rendiconto_trasferimenti")) || [];
  if (!Array.isArray(transfers)) transfers = [];
} catch (e) {
  transfers = [];
}

try {
  incomes = JSON.parse(localStorage.getItem("rendiconto_entrate")) || [];
  if (!Array.isArray(incomes)) incomes = [];
} catch (e) {
  incomes = [];
}

const euro = value => Number(value).toLocaleString("it-IT", {
  style:"currency", currency:"EUR"
});

function persist() {
  localStorage.setItem("rendiconto_conti", JSON.stringify(accounts));
  localStorage.setItem("rendiconto_trasferimenti", JSON.stringify(transfers));
  localStorage.setItem("rendiconto_entrate", JSON.stringify(incomes));
  render();
}

function render() {
  document.getElementById("total").textContent =
    euro(accounts.reduce((sum, a) => sum + (Number(a.balance) || 0), 0));

  const container = document.getElementById("accounts");
  container.innerHTML = "";

  if (!accounts.length) {
    container.innerHTML =
      '<div class="empty">Aggiungi il tuo primo conto per iniziare.</div>';
  }

  accounts.forEach(a => {
    const card = document.createElement("div");
    card.className = "account";
    card.onclick = () => openAccountDetail(a.id);

    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.background = a.color;

    const details = document.createElement("div");
    details.className = "details";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = a.name;

    const balance = document.createElement("div");
    balance.className = "balance";
    balance.textContent = euro(a.balance);

    details.append(name, balance);
    card.append(dot, details);
    container.append(card);
  });

  renderTransfers();
}

function openAccountDetail(id) {
  closeForm();
  closeTransfer();
  closeIncome();

  const account = accounts.find(a => a.id === id);
  if (!account) return;

  selectedAccountId = id;
  document.getElementById("detailName").textContent = account.name;
  document.getElementById("detailBalance").textContent = euro(account.balance);
  document.getElementById("accountDetail").style.display = "block";
  document.getElementById("accountDetail").scrollIntoView({behavior:"smooth"});
}

function closeAccountDetail() {
  document.getElementById("accountDetail").style.display = "none";
  selectedAccountId = null;
}

function editSelectedAccount() {
  if (selectedAccountId === null) return;

  const id = selectedAccountId;
  closeAccountDetail();
  editAccount(id);
}

function deleteSelectedAccount() {
  if (selectedAccountId === null) return;

  const id = selectedAccountId;
  closeAccountDetail();
  deleteAccount(id);
}

function renderTransfers() {
  const container = document.getElementById("transferHistory");
  const button = document.getElementById("showMore");
  container.innerHTML = "";

  const movements = [
    ...transfers.map(t => ({...t, type:"transfer"})),
    ...incomes.map(i => ({...i, type:i.type || "income"}))
  ];

  movements.sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));

  button.style.display = movements.length > 5 ? "block" : "none";
  button.textContent = showAllTransfers ? "Mostra meno" : "Mostra altro";

  const visible = showAllTransfers ? movements : movements.slice(0, 5);

  if (!visible.length) {
    container.innerHTML =
      '<div class="empty">Non hai ancora effettuato movimenti.</div>';
    return;
  }

  visible.forEach(m => {
    const row = document.createElement("div");
    row.className = "transferRow";

    const left = document.createElement("div");
    left.className = "transferName";

    const middle = document.createElement("div");
    middle.className = "transferMiddle";

    const amount = document.createElement("span");
    amount.className = "transferAmount";

    const right = document.createElement("div");
    right.className = "transferName";
    right.style.textAlign = "right";

    if (m.type === "transfer") {
      left.textContent = m.fromName;
      left.style.color = m.fromColor;

      amount.textContent = "+ " + euro(m.amount);

      right.textContent = m.toName;
      right.style.color = m.toColor;
    } else {
      left.textContent = m.description || "Entrata";
      left.style.color = m.type === "expense" ? "#E05260" : "#18A779";

      amount.textContent =
        (m.type === "expense" ? "− " : "+ ") + euro(m.amount);

      right.textContent = m.accountName;
      right.style.color = m.accountColor;
    }

    middle.append(amount);

    const date = document.createElement("div");
    date.className = "movementDate";
    date.textContent = m.date
      ? new Date(m.date).toLocaleDateString("it-IT")
      : "Data non disponibile";

    left.append(date);
    row.append(left, middle, right);
    container.append(row);
  });
}

function toggleTransfers() {
  showAllTransfers = !showAllTransfers;
  renderTransfers();
}

function renderColors() {
  const container = document.getElementById("colors");
  container.innerHTML = "";

  palette.forEach(color => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "color" +
      (selectedColor === color ? " selected" : "");
    button.style.background = color;
    button.setAttribute("aria-label", "Seleziona colore");
    button.setAttribute("aria-pressed", selectedColor === color);
    button.onclick = () => {
      selectedColor = color;
      renderColors();
    };
    container.append(button);
  });
}

function newAccount() {
  closeAccountDetail();
  closeTransfer();
  closeIncome();
  editingId = null;
  selectedColor = palette[accounts.length % palette.length];
  document.getElementById("formTitle").textContent = "Nuovo conto";
  document.getElementById("name").value = "";
  document.getElementById("balance").value = "";
  renderColors();
  document.getElementById("form").style.display = "block";
  document.getElementById("name").focus();
}

function editAccount(id) {
  closeAccountDetail();
  closeTransfer();
  closeIncome();

  const a = accounts.find(item => item.id === id);
  if (!a) return;

  editingId = id;
  selectedColor = a.color;
  document.getElementById("formTitle").textContent = "Modifica conto";
  document.getElementById("name").value = a.name;
  document.getElementById("balance").value = a.balance;
  renderColors();
  document.getElementById("form").style.display = "block";
  document.getElementById("form").scrollIntoView({behavior:"smooth"});
}

function saveAccount() {
  const name = document.getElementById("name").value.trim();
  const rawBalance = document.getElementById("balance").value.trim();

  if (!name) {
    alert("Inserisci il nome del conto.");
    return;
  }

  if (rawBalance === "" || !Number.isFinite(Number(rawBalance))) {
    alert("Inserisci un saldo valido.");
    return;
  }

  const balance = Number(rawBalance);

  if (editingId !== null) {
    const a = accounts.find(item => item.id === editingId);
    if (a) {
      a.name = name;
      a.balance = balance;
      a.color = selectedColor;
    }
  } else {
    accounts.push({
      id: Date.now().toString() + Math.random().toString(16).slice(2),
      name,
      balance,
      color: selectedColor
    });
  }

  persist();
  closeForm();
}

function deleteAccount(id) {
  const a = accounts.find(item => item.id === id);
  if (!a) return;

  if (confirm('Vuoi eliminare il conto "' + a.name + '"?')) {
    accounts = accounts.filter(item => item.id !== id);
    persist();
  }
}

function closeForm() {
  document.getElementById("form").style.display = "none";
  editingId = null;
}

function openTransfer() {
  closeForm();
  closeAccountDetail();
  closeIncome();

  if (accounts.length < 2) {
    alert("Devi avere almeno due conti per effettuare un trasferimento.");
    return;
  }

  const from = document.getElementById("from");
  const to = document.getElementById("to");
  from.innerHTML = "";
  to.innerHTML = "";

  accounts.forEach(a => {
    const optionFrom = document.createElement("option");
    optionFrom.value = a.id;
    optionFrom.textContent = a.name + " (" + euro(a.balance) + ")";
    from.append(optionFrom);

    const optionTo = document.createElement("option");
    optionTo.value = a.id;
    optionTo.textContent = a.name;
    to.append(optionTo);
  });

  to.selectedIndex = 1;
  document.getElementById("transferAmount").value = "";
  document.getElementById("transferForm").style.display = "block";
  document.getElementById("transferForm").scrollIntoView({behavior:"smooth"});
}

function saveTransfer() {
  const fromId = document.getElementById("from").value;
  const toId = document.getElementById("to").value;
  const rawAmount = document.getElementById("transferAmount").value.trim();
  const amount = Math.round(Number(rawAmount) * 100) / 100;

  if (fromId === toId) {
    alert("Scegli due conti diversi.");
    return;
  }

  if (rawAmount === "" || !Number.isFinite(amount) || amount <= 0) {
    alert("Inserisci un importo valido.");
    return;
  }

  const from = accounts.find(a => a.id === fromId);
  const to = accounts.find(a => a.id === toId);

  if (!from || !to) {
    alert("Seleziona due conti validi.");
    return;
  }

  if (Math.round(Number(from.balance) * 100) < Math.round(amount * 100)) {
    alert("Saldo insufficiente nel conto di partenza.");
    return;
  }

  from.balance = Math.round((Number(from.balance) - amount) * 100) / 100;
  to.balance = Math.round((Number(to.balance) + amount) * 100) / 100;

  transfers.unshift({
    fromName: from.name,
    fromColor: from.color,
    toName: to.name,
    toColor: to.color,
    amount: amount,
    date: Date.now()
  });

  persist();
  closeTransfer();
}

function closeTransfer() {
  document.getElementById("transferForm").style.display = "none";
}

function openIncome() {
  closeForm();
  closeTransfer();
  closeAccountDetail();

  if (!accounts.length) {
    alert("Devi prima aggiungere almeno un conto.");
    return;
  }

  const select = document.getElementById("incomeAccount");
  select.innerHTML = "";

  accounts.forEach(a => {
    const option = document.createElement("option");
    option.value = a.id;
    option.textContent = a.name + " (" + euro(a.balance) + ")";
    select.append(option);
  });

  document.getElementById("movementType").value = "income";
  document.getElementById("incomeAmount").value = "";
  document.getElementById("incomeDescription").value = "";
  document.getElementById("incomeForm").style.display = "block";
  document.getElementById("incomeForm").scrollIntoView({behavior:"smooth"});
}

function saveIncome() {
  const accountId = document.getElementById("incomeAccount").value;
  const rawAmount = document.getElementById("incomeAmount").value.trim();
  const amount = Math.round(Number(rawAmount) * 100) / 100;
  const description =
    document.getElementById("incomeDescription").value.trim();
  const type = document.getElementById("movementType").value;

  if (rawAmount === "" || !Number.isFinite(amount) || amount <= 0) {
    alert("Inserisci un importo valido.");
    return;
  }

  const account = accounts.find(a => a.id === accountId);

  if (!account) {
    alert("Seleziona un conto valido.");
    return;
  }

  if (type === "expense" &&
      Math.round(Number(account.balance) * 100) < Math.round(amount * 100)) {
    alert("Saldo insufficiente nel conto selezionato.");
    return;
  }

  const change = type === "expense" ? -amount : amount;

  account.balance =
    Math.round((Number(account.balance) + change) * 100) / 100;

  incomes.unshift({
    type: type,
    accountName: account.name,
    accountColor: account.color,
    description: description || (type === "expense" ? "Uscita" : "Entrata"),
    amount: amount,
    date: Date.now()
  });

  persist();
  closeIncome();
}

function closeIncome() {
  document.getElementById("incomeForm").style.display = "none";
}

render();
</script>
</body>
</html>
