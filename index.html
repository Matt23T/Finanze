
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>I miei soldi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#17191d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 18px 40px}
.app{max-width:480px;margin:auto}
.total{text-align:center;padding:35px 10px 30px}
.label{font-size:13px;color:#777;font-weight:600;letter-spacing:1px}
.amount{font-size:40px;font-weight:750;letter-spacing:-1.5px;margin-top:12px;overflow-wrap:anywhere}
h2{font-size:19px;margin:12px 0 16px}
.account{background:white;border-radius:18px;padding:17px;margin-bottom:12px;display:flex;align-items:center;gap:13px;box-shadow:0 2px 10px #00000006;cursor:pointer}
.dot{width:12px;height:46px;border-radius:8px;flex-shrink:0}
.details{flex:1;min-width:0}
.name{font-size:15px;font-weight:650;overflow-wrap:anywhere}
.balance{font-size:18px;font-weight:700;margin-top:5px;overflow-wrap:anywhere}
button{cursor:pointer;font:inherit}
.add{width:100%;border:0;border-radius:15px;padding:16px;background:#17191d;color:white;font-weight:650;font-size:15px;margin-top:7px}
.transfer{background:#3978E8;margin-top:10px}
.income{background:#18A779;margin-top:10px}
.form{display:none;background:white;border-radius:18px;padding:18px;margin-top:15px}
.form h2{margin:0 0 18px}
label{display:block;font-size:13px;color:#666;margin:14px 0 7px}
input,select{width:100%;border:1px solid #dddfe4;border-radius:11px;padding:13px;font-size:16px;background:white;color:#17191d;min-width:0}
.colors{display:flex;gap:11px;flex-wrap:wrap;margin-top:10px}
.color{width:30px;height:30px;border-radius:50%;border:3px solid white;outline:1px solid #ddd}
.color.selected{outline:3px solid #17191d}
.formbuttons{display:flex;gap:10px;margin-top:20px}
.formbuttons button{flex:1;border:0;border-radius:11px;padding:13px;font-weight:600}
.save{background:#17191d;color:white}
.cancel{background:#f0f1f4}
.empty{text-align:center;color:#777;font-size:14px;padding:25px 10px}
.history{margin-top:28px}
.historyHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.historyHead h2{margin:0}
.more{border:0;background:transparent;color:#3978E8;font-size:14px;font-weight:600;padding:8px 0}
.transferRow{background:white;border-radius:14px;padding:15px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:9px;box-shadow:0 2px 10px #00000006}
.transferName{font-size:14px;font-weight:650;overflow-wrap:anywhere;min-width:0}
.transferMiddle{display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.transferAmount{font-size:14px;font-weight:700}
.movementDate{font-size:11px;color:#888;font-weight:400;margin-top:5px}
.detailBalance{font-size:30px;font-weight:750;margin:10px 0 20px;overflow-wrap:anywhere}
.detailActions{display:flex;gap:10px;margin-top:18px}
.detailActions button{flex:1;border:0;border-radius:11px;padding:13px;font-weight:600;background:#f0f1f4}
.detailActions .delete{background:#FCE8E8;color:#B42318}
.sectionTitle{font-size:15px;font-weight:700;margin:20px 0 10px}
.componentEditor{border:1px solid #e6e7eb;border-radius:13px;padding:13px;margin-bottom:10px}
.componentEditorHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.componentEditorHead strong{font-size:13px}
.removeComponent{border:0;background:#FCE8E8;color:#B42318;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600}
.componentEditor label{margin-top:10px}
.addComponent{width:100%;border:1px dashed #b8bdc7;background:#fafbfc;color:#333;border-radius:12px;padding:13px;font-size:14px;font-weight:600;margin-top:3px}
.componentRow{background:white;border-radius:13px;padding:13px;margin-bottom:8px;display:flex;align-items:center;gap:11px}
.componentDot{width:9px;height:35px;border-radius:6px;flex-shrink:0}
.componentInfo{flex:1;min-width:0}
.componentName{font-size:14px;font-weight:650;overflow-wrap:anywhere}
.componentType{font-size:12px;color:#777;margin-top:4px}
.componentValue{font-size:15px;font-weight:700;white-space:nowrap}
.help{font-size:12px;color:#777;line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="total">
    <div class="label">PATRIMONIO TOTALE</div>
    <div class="amount" id="total">€ 0,00</div>
  </div>

  <h2>I miei conti</h2>
  <div id="accounts"></div>

  <div class="form" id="accountDetail">
    <h2 id="detailName">Dettagli conto</h2>
    <div class="label">SALDO TOTALE</div>
    <div class="detailBalance" id="detailBalance">€ 0,00</div>
    <div class="sectionTitle">Composizione del conto</div>
    <div id="detailComponents"></div>
    <div class="detailActions">
      <button onclick="editSelectedAccount()">Modifica</button>
      <button class="delete" onclick="deleteSelectedAccount()">Elimina</button>
    </div>
    <div class="formbuttons">
      <button class="cancel" onclick="closeAccountDetail()">Chiudi</button>
    </div>
  </div>

  <button class="add" onclick="newAccount()">+ Aggiungi un conto</button>
  <button class="add income" onclick="openIncome()">+ Aggiungi movimento</button>
  <button class="add transfer" onclick="openTransfer()">⇄ Trasferisci tra conti</button>

  <div class="form" id="transferForm">
    <h2>Trasferimento</h2>

    <label for="from">Da quale conto</label>
    <select id="from"></select>

    <label for="to">A quale conto</label>
    <select id="to"></select>

    <label for="transferAmount">Importo da trasferire (€)</label>
    <input id="transferAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00">

    <div class="formbuttons">
      <button class="cancel" onclick="closeTransfer()">Annulla</button>
      <button class="save" onclick="saveTransfer()">Trasferisci</button>
    </div>
  </div>

  <div class="form" id="incomeForm">
    <h2>Nuovo movimento</h2>

    <label for="movementType">Tipo di movimento</label>
    <select id="movementType">
      <option value="income">Entrata</option>
      <option value="expense">Uscita</option>
    </select>

    <label for="incomeAccount">Su quale conto</label>
    <select id="incomeAccount"></select>

    <label for="incomeAmount">Importo (€)</label>
    <input id="incomeAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00">

    <label for="incomeDescription">Descrizione</label>
    <input id="incomeDescription" maxlength="80" placeholder="Es. Stipendio, spesa, bolletta">

    <div class="formbuttons">
      <button class="cancel" onclick="closeIncome()">Annulla</button>
      <button class="save" onclick="saveIncome()">Salva movimento</button>
    </div>
  </div>

  <div class="history">
    <div class="historyHead">
      <h2>Ultimi movimenti</h2>
      <button class="more" id="showMore" onclick="toggleTransfers()">Mostra altro</button>
    </div>
    <div id="transferHistory"></div>
  </div>

  <div class="form" id="form">
    <h2 id="formTitle">Nuovo conto</h2>

    <label for="name">Nome del conto</label>
    <input id="name" placeholder="Es. Intesa, Kraken, Poste" maxlength="50">

    <div class="sectionTitle">Composizione del conto</div>
    <div id="componentEditors"></div>
    <button type="button" class="addComponent" onclick="addComponentEditor()">+ Aggiungi una componente</button>
    <div class="help">Il saldo totale viene calcolato sommando i valori delle componenti.</div>

    <label>Colore del conto</label>
    <div class="colors" id="colors"></div>

    <div class="formbuttons">
      <button class="cancel" onclick="closeForm()">Annulla</button>
      <button class="save" onclick="saveAccount()">Salva</button>
    </div>
  </div>
</div>

<script>
const palette = [
  "#3978E8","#18A779","#9659D8","#F19A38",
  "#E05260","#16A6B6","#6B7280","#D3A72F"
];

const componentTypes = [
  {value:"liquidita",label:"Liquidità"},
  {value:"cripto",label:"Cripto"},
  {value:"investimenti",label:"Investimenti"}
];

let accounts = [];
let transfers = [];
let incomes = [];
let editingId = null;
let selectedAccountId = null;
let selectedColor = palette[0];
let showAllTransfers = false;
let draftComponents = [];

try {
  accounts = JSON.parse(localStorage.getItem("rendiconto_conti")) || [];
  if (!Array.isArray(accounts)) accounts = [];
} catch (e) {
  accounts = [];
}

try {
  transfers = JSON.parse(localStorage.getItem("rendiconto_trasferimenti")) || [];
  if (!Array.isArray(transfers)) transfers = [];
} catch (e) {
  transfers = [];
}

try {
  incomes = JSON.parse(localStorage.getItem("rendiconto_entrate")) || [];
  if (!Array.isArray(incomes)) incomes = [];
} catch (e) {
  incomes = [];
}

const euro = value => Number(value || 0).toLocaleString("it-IT", {
  style:"currency", currency:"EUR"
});

function roundMoney(value) {
  return Math.round((Number(value) || 0) * 100) / 100;
}

function componentTotal(account) {
  if (Array.isArray(account.components)) {
    return roundMoney(account.components.reduce(
      (sum, component) => sum + (Number(component.value) || 0), 0
    ));
  }
  return roundMoney(account.balance);
}

function syncBalance(account) {
  account.balance = componentTotal(account);
  return account.balance;
}

function makeLiquidity(value) {
  return {
    id:Date.now().toString() + Math.random().toString(16).slice(2),
    type:"liquidita",
    name:"Liquidità",
    value:roundMoney(value)
  };
}

/* I conti precedenti vengono mantenuti e convertiti
   in una componente Liquidità con il saldo già presente. */
accounts = accounts.map(account => {
  if (!Array.isArray(account.components) || !account.components.length) {
    account.components = [makeLiquidity(account.balance)];
  } else {
    account.components = account.components.map(component => ({
      id:component.id || (Date.now().toString() + Math.random().toString(16).slice(2)),
      type:component.type || "liquidita",
      name:component.type === "liquidita"
        ? "Liquidità"
        : (component.name || ""),
      value:roundMoney(component.value)
    }));
  }
  syncBalance(account);
  return account;
});

function persist() {
  accounts.forEach(syncBalance);
  localStorage.setItem("rendiconto_conti", JSON.stringify(accounts));
  localStorage.setItem("rendiconto_trasferimenti", JSON.stringify(transfers));
  localStorage.setItem("rendiconto_entrate", JSON.stringify(incomes));
  render();
}

function render() {
  document.getElementById("total").textContent =
    euro(accounts.reduce((sum, account) => sum + componentTotal(account), 0));

  const container = document.getElementById("accounts");
  container.innerHTML = "";

  if (!accounts.length) {
    container.innerHTML =
      '<div class="empty">Aggiungi il tuo primo conto per iniziare.</div>';
  }

  accounts.forEach(account => {
    const card = document.createElement("div");
    card.className = "account";
    card.onclick = () => openAccountDetail(account.id);

    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.background = account.color;

    const details = document.createElement("div");
    details.className = "details";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = account.name;

    const balance = document.createElement("div");
    balance.className = "balance";
    balance.textContent = euro(componentTotal(account));

    details.append(name, balance);
    card.append(dot, details);
    container.append(card);
  });

  renderTransfers();
}

function componentDisplayName(component) {
  if (component.type === "liquidita") return "Liquidità";
  if (component.type === "cripto") return component.name || "Cripto";
  if (component.type === "investimenti") return component.name || "Investimento";
  return component.name || "Componente";
}

function componentTypeName(type) {
  const item = componentTypes.find(option => option.value === type);
  return item ? item.label : "Liquidità";
}

function componentColor(type) {
  if (type === "liquidita") return "#3978E8";
  if (type === "cripto") return "#9659D8";
  return "#18A779";
}

function renderDetailComponents(account) {
  const container = document.getElementById("detailComponents");
  container.innerHTML = "";

  if (!account.components.length) {
    container.innerHTML = '<div class="empty">Nessuna componente presente.</div>';
    return;
  }

  account.components.forEach(component => {
    const row = document.createElement("div");
    row.className = "componentRow";

    const dot = document.createElement("div");
    dot.className = "componentDot";
    dot.style.background = componentColor(component.type);

    const info = document.createElement("div");
    info.className = "componentInfo";

    const name = document.createElement("div");
    name.className = "componentName";
    name.textContent = componentDisplayName(component);

    const type = document.createElement("div");
    type.className = "componentType";
    type.textContent = componentTypeName(component.type);

    const value = document.createElement("div");
    value.className = "componentValue";
    value.textContent = euro(component.value);

    info.append(name, type);
    row.append(dot, info, value);
    container.append(row);
  });
}

function openAccountDetail(id) {
  closeForm();
  closeTransfer();
  closeIncome();

  const account = accounts.find(item => item.id === id);
  if (!account) return;

  selectedAccountId = id;
  document.getElementById("detailName").textContent = account.name;
  document.getElementById("detailBalance").textContent = euro(componentTotal(account));
  renderDetailComponents(account);
  document.getElementById("accountDetail").style.display = "block";
  document.getElementById("accountDetail").scrollIntoView({behavior:"smooth"});
}

function closeAccountDetail() {
  document.getElementById("accountDetail").style.display = "none";
  selectedAccountId = null;
}

function editSelectedAccount() {
  if (selectedAccountId === null) return;

  const id = selectedAccountId;
  closeAccountDetail();
  editAccount(id);
}

function deleteSelectedAccount() {
  if (selectedAccountId === null) return;

  const id = selectedAccountId;
  closeAccountDetail();
  deleteAccount(id);
}

function renderTransfers() {
  const container = document.getElementById("transferHistory");
  const button = document.getElementById("showMore");
  container.innerHTML = "";

  const movements = [
    ...transfers.map(t => ({...t, type:"transfer"})),
    ...incomes.map(i => ({...i, type:i.type || "income"}))
  ];

  movements.sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));

  button.style.display = movements.length > 5 ? "block" : "none";
  button.textContent = showAllTransfers ? "Mostra meno" : "Mostra altro";

  const visible = showAllTransfers ? movements : movements.slice(0, 5);

  if (!visible.length) {
    container.innerHTML =
      '<div class="empty">Non hai ancora effettuato movimenti.</div>';
    return;
  }

  visible.forEach(m => {
    const row = document.createElement("div");
    row.className = "transferRow";

    const left = document.createElement("div");
    left.className = "transferName";

    const middle = document.createElement("div");
    middle.className = "transferMiddle";

    const amount = document.createElement("span");
    amount.className = "transferAmount";

    const right = document.createElement("div");
    right.className = "transferName";
    right.style.textAlign = "right";

    if (m.type === "transfer") {
      left.textContent = m.fromName;
      left.style.color = m.fromColor;
      amount.textContent = "+ " + euro(m.amount);
      right.textContent = m.toName;
      right.style.color = m.toColor;
    } else {
      left.textContent = m.description || "Entrata";
      left.style.color = m.type === "expense" ? "#E05260" : "#18A779";
      amount.textContent =
        (m.type === "expense" ? "− " : "+ ") + euro(m.amount);
      right.textContent = m.accountName;
      right.style.color = m.accountColor;
    }

    middle.append(amount);

    const date = document.createElement("div");
    date.className = "movementDate";
    date.textContent = m.date
      ? new Date(m.date).toLocaleDateString("it-IT")
      : "Data non disponibile";

    left.append(date);
    row.append(left, middle, right);
    container.append(row);
  });
}

function toggleTransfers() {
  showAllTransfers = !showAllTransfers;
  renderTransfers();
}

function renderColors() {
  const container = document.getElementById("colors");
  container.innerHTML = "";

  palette.forEach(color => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "color" +
      (selectedColor === color ? " selected" : "");
    button.style.background = color;
    button.setAttribute("aria-label", "Seleziona colore");
    button.setAttribute("aria-pressed", selectedColor === color);
    button.onclick = () => {
      selectedColor = color;
      renderColors();
    };
    container.append(button);
  });
}

function renderComponentEditors() {
  const container = document.getElementById("componentEditors");
  container.innerHTML = "";

  draftComponents.forEach((component, index) => {
    const editor = document.createElement("div");
    editor.className = "componentEditor";

    const head = document.createElement("div");
    head.className = "componentEditorHead";

    const title = document.createElement("strong");
    title.textContent = "Componente " + (index + 1);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "removeComponent";
    remove.textContent = "Rimuovi";
    remove.onclick = () => {
      draftComponents.splice(index, 1);
      renderComponentEditors();
    };

    head.append(title, remove);
    editor.append(head);

    const typeLabel = document.createElement("label");
    typeLabel.textContent = "Tipo";

    const typeSelect = document.createElement("select");

    componentTypes.forEach(optionData => {
      const option = document.createElement("option");
      option.value = optionData.value;
      option.textContent = optionData.label;
      typeSelect.append(option);
    });

    typeSelect.value = component.type;
    typeSelect.onchange = () => {
      component.type = typeSelect.value;
      component.name = component.type === "liquidita" ? "Liquidità" : "";
      renderComponentEditors();
    };

    editor.append(typeLabel, typeSelect);

    if (component.type !== "liquidita") {
      const nameLabel = document.createElement("label");
      nameLabel.textContent =
        component.type === "cripto" ? "Nome della criptovaluta" : "Nome dell'investimento";

      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.maxLength = 50;
      nameInput.placeholder =
        component.type === "cripto" ? "Es. BTC, ETH" : "Es. Apple, ETF S&P 500";
      nameInput.value = component.name || "";
      nameInput.oninput = () => {
        component.name = nameInput.value;
      };

      editor.append(nameLabel, nameInput);
    }

    const valueLabel = document.createElement("label");
    valueLabel.textContent = "Valore attuale (€)";

    const valueInput = document.createElement("input");
    valueInput.type = "number";
    valueInput.inputMode = "decimal";
    valueInput.step = "0.01";
    valueInput.placeholder = "0,00";
    valueInput.value = component.value;
    valueInput.oninput = () => {
      component.value = valueInput.value;
    };

    editor.append(valueLabel, valueInput);
    container.append(editor);
  });
}

function addComponentEditor() {
  draftComponents.push({
    id:Date.now().toString() + Math.random().toString(16).slice(2),
    type:"cripto",
    name:"",
    value:0
  });
  renderComponentEditors();
}

function newAccount() {
  closeAccountDetail();
  closeTransfer();
  closeIncome();

  editingId = null;
  selectedColor = palette[accounts.length % palette.length];
  draftComponents = [makeLiquidity(0)];

  document.getElementById("formTitle").textContent = "Nuovo conto";
  document.getElementById("name").value = "";

  renderComponentEditors();
  renderColors();

  document.getElementById("form").style.display = "block";
  document.getElementById("form").scrollIntoView({behavior:"smooth"});
  document.getElementById("name").focus();
}

function editAccount(id) {
  closeAccountDetail();
  closeTransfer();
  closeIncome();

  const account = accounts.find(item => item.id === id);
  if (!account) return;

  editingId = id;
  selectedColor = account.color;

  draftComponents = account.components.map(component => ({
    id:component.id,
    type:component.type,
    name:component.name || "",
    value:component.value
  }));

  document.getElementById("formTitle").textContent = "Modifica conto";
  document.getElementById("name").value = account.name;

  renderComponentEditors();
  renderColors();

  document.getElementById("form").style.display = "block";
  document.getElementById("form").scrollIntoView({behavior:"smooth"});
}

function saveAccount() {
  const name = document.getElementById("name").value.trim();

  if (!name) {
    alert("Inserisci il nome del conto.");
    return;
  }

  if (!draftComponents.length) {
    alert("Aggiungi almeno una componente al conto.");
    return;
  }

  const components = [];

  for (const component of draftComponents) {
    const value = component.value === "" ? NaN : Number(component.value);

    if (!Number.isFinite(value)) {
      alert("Inserisci un valore valido per ogni componente.");
      return;
    }

    if (component.type !== "liquidita" && value < 0) {
      alert("Il valore di cripto e investimenti non può essere negativo.");
      return;
    }

    if (component.type !== "liquidita" && !component.name.trim()) {
      alert("Inserisci il nome di ogni cripto o investimento.");
      return;
    }

    components.push({
      id:component.id || (Date.now().toString() + Math.random().toString(16).slice(2)),
      type:component.type,
      name:component.type === "liquidita" ? "Liquidità" : component.name.trim(),
      value:roundMoney(value)
    });
  }

  const balance = roundMoney(components.reduce(
    (sum, component) => sum + component.value, 0
  ));

  if (editingId !== null) {
    const account = accounts.find(item => item.id === editingId);
    if (account) {
      account.name = name;
      account.components = components;
      account.balance = balance;
      account.color = selectedColor;
    }
  } else {
    accounts.push({
      id:Date.now().toString() + Math.random().toString(16).slice(2),
      name,
      balance,
      components,
      color:selectedColor
    });
  }

  persist();
  closeForm();
}

function deleteAccount(id) {
  const account = accounts.find(item => item.id === id);
  if (!account) return;

  if (confirm('Vuoi eliminare il conto "' + account.name + '"?')) {
    accounts = accounts.filter(item => item.id !== id);
    persist();
  }
}

function closeForm() {
  document.getElementById("form").style.display = "none";
  editingId = null;
}

function getLiquidity(account) {
  let liquidity = account.components.find(component => component.type === "liquidita");

  if (!liquidity) {
    liquidity = makeLiquidity(0);
    account.components.unshift(liquidity);
  }

  return liquidity;
}

function changeLiquidity(account, amount) {
  const liquidity = getLiquidity(account);
  liquidity.value = roundMoney(Number(liquidity.value) + amount);
  syncBalance(account);
}

function openTransfer() {
  closeForm();
  closeAccountDetail();
  closeIncome();

  if (accounts.length < 2) {
    alert("Devi avere almeno due conti per effettuare un trasferimento.");
    return;
  }

  const from = document.getElementById("from");
  const to = document.getElementById("to");
  from.innerHTML = "";
  to.innerHTML = "";

  accounts.forEach(account => {
    const optionFrom = document.createElement("option");
    optionFrom.value = account.id;
    optionFrom.textContent = account.name + " (" + euro(componentTotal(account)) + ")";
    from.append(optionFrom);

    const optionTo = document.createElement("option");
    optionTo.value = account.id;
    optionTo.textContent = account.name;
    to.append(optionTo);
  });

  to.selectedIndex = 1;
  document.getElementById("transferAmount").value = "";
  document.getElementById("transferForm").style.display = "block";
  document.getElementById("transferForm").scrollIntoView({behavior:"smooth"});
}

function saveTransfer() {
  const fromId = document.getElementById("from").value;
  const toId = document.getElementById("to").value;
  const rawAmount = document.getElementById("transferAmount").value.trim();
  const amount = roundMoney(Number(rawAmount));

  if (fromId === toId) {
    alert("Scegli due conti diversi.");
    return;
  }

  if (rawAmount === "" || !Number.isFinite(amount) || amount <= 0) {
    alert("Inserisci un importo valido.");
    return;
  }

  const from = accounts.find(account => account.id === fromId);
  const to = accounts.find(account => account.id === toId);

  if (!from || !to) {
    alert("Seleziona due conti validi.");
    return;
  }

  const fromLiquidity = getLiquidity(from);

  if (Math.round(Number(fromLiquidity.value) * 100) < Math.round(amount * 100)) {
    alert("Liquidità insufficiente nel conto di partenza.");
    return;
  }

  changeLiquidity(from, -amount);
  changeLiquidity(to, amount);

  transfers.unshift({
    fromName:from.name,
    fromColor:from.color,
    toName:to.name,
    toColor:to.color,
    amount:amount,
    date:Date.now()
  });

  persist();
  closeTransfer();
}

function closeTransfer() {
  document.getElementById("transferForm").style.display = "none";
}

function openIncome() {
  closeForm();
  closeTransfer();
  closeAccountDetail();

  if (!accounts.length) {
    alert("Devi prima aggiungere almeno un conto.");
    return;
  }

  const select = document.getElementById("incomeAccount");
  select.innerHTML = "";

  accounts.forEach(account => {
    const option = document.createElement("option");
    option.value = account.id;
    option.textContent = account.name + " (" + euro(componentTotal(account)) + ")";
    select.append(option);
  });

  document.getElementById("movementType").value = "income";
  document.getElementById("incomeAmount").value = "";
  document.getElementById("incomeDescription").value = "";
  document.getElementById("incomeForm").style.display = "block";
  document.getElementById("incomeForm").scrollIntoView({behavior:"smooth"});
}

function saveIncome() {
  const accountId = document.getElementById("incomeAccount").value;
  const rawAmount = document.getElementById("incomeAmount").value.trim();
  const amount = roundMoney(Number(rawAmount));
  const description = document.getElementById("incomeDescription").value.trim();
  const type = document.getElementById("movementType").value;

  if (rawAmount === "" || !Number.isFinite(amount) || amount <= 0) {
    alert("Inserisci un importo valido.");
    return;
  }

  const account = accounts.find(item => item.id === accountId);

  if (!account) {
    alert("Seleziona un conto valido.");
    return;
  }

  const liquidity = getLiquidity(account);

  if (type === "expense" &&
      Math.round(Number(liquidity.value) * 100) < Math.round(amount * 100)) {
    alert("Liquidità insufficiente nel conto selezionato.");
    return;
  }

  const change = type === "expense" ? -amount : amount;
  changeLiquidity(account, change);

  incomes.unshift({
    type:type,
    accountName:account.name,
    accountColor:account.color,
    description:description || (type === "expense" ? "Uscita" : "Entrata"),
    amount:amount,
    date:Date.now()
  });

  persist();
  closeIncome();
}

function closeIncome() {
  document.getElementById("incomeForm").style.display = "none";
}

render();
</script>
</body>
</html>
