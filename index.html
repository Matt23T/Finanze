
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>I miei soldi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#17191d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 18px 40px}
.app{max-width:480px;margin:auto}
.total{text-align:center;padding:35px 10px 30px}
.label{font-size:13px;color:#777;font-weight:600;letter-spacing:1px}
.amount{font-size:40px;font-weight:750;letter-spacing:-1.5px;margin-top:12px;overflow-wrap:anywhere}
h2{font-size:19px;margin:12px 0 16px}
.account{background:white;border-radius:18px;padding:17px;margin-bottom:12px;display:flex;align-items:center;gap:13px;box-shadow:0 2px 10px #00000006;cursor:pointer}
.dot{width:12px;height:46px;border-radius:8px;flex-shrink:0}
.details{flex:1;min-width:0}
.name{font-size:15px;font-weight:650;overflow-wrap:anywhere}
.balance{font-size:18px;font-weight:700;margin-top:5px;overflow-wrap:anywhere}
button{cursor:pointer;font:inherit}
.add{width:100%;border:0;border-radius:15px;padding:16px;background:#17191d;color:white;font-weight:650;font-size:15px;margin-top:7px}
.transfer{background:#3978E8;margin-top:10px}
.income{background:#18A779;margin-top:10px}
.form{display:none;background:white;border-radius:18px;padding:18px;margin-top:15px}
.form h2{margin:0 0 18px}
label{display:block;font-size:13px;color:#666;margin:14px 0 7px}
input,select{width:100%;border:1px solid #dddfe4;border-radius:11px;padding:13px;font-size:16px;background:white;color:#17191d}
.colors{display:flex;gap:11px;flex-wrap:wrap;margin-top:10px}
.color{width:30px;height:30px;border-radius:50%;border:3px solid white;outline:1px solid #ddd}
.color.selected{outline:3px solid #17191d}
.formbuttons{display:flex;gap:10px;margin-top:20px}
.formbuttons button{flex:1;border:0;border-radius:11px;padding:13px;font-weight:600}
.save{background:#17191d;color:white}
.cancel{background:#f0f1f4}
.empty{text-align:center;color:#777;font-size:14px;padding:25px 10px}
.history{margin-top:28px}
.historyHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.historyHead h2{margin:0}
.more{border:0;background:transparent;color:#3978E8;font-size:14px;font-weight:600;padding:8px 0}
.transferRow{background:white;border-radius:14px;padding:15px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:9px;box-shadow:0 2px 10px #00000006}
.transferName{font-size:14px;font-weight:650;overflow-wrap:anywhere;min-width:0}
.transferMiddle{display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0}
.transferAmount{font-size:14px;font-weight:700}
.assetName{font-size:11px;color:#777;font-weight:600}
.movementDate{font-size:11px;color:#888;font-weight:400;margin-top:5px}
.detailBalance{font-size:30px;font-weight:750;margin:10px 0 20px;overflow-wrap:anywhere}
.detailActions{display:flex;gap:10px;margin-top:18px}
.detailActions button{flex:1;border:0;border-radius:11px;padding:13px;font-weight:600;background:#f0f1f4}
.detailActions .delete{background:#FCE8E8;color:#B42318}
.composition{background:#f5f6f8;border-radius:13px;padding:14px;margin-top:12px}
.compositionTitle{font-size:12px;color:#777;font-weight:650;letter-spacing:.5px;margin-bottom:10px}
.compositionRow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:14px}
.compositionRow+.compositionRow{border-top:1px solid #e3e5e9}
.compositionRow strong{overflow-wrap:anywhere;text-align:right}
.assetRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 0;font-size:14px}
.assetRow+.assetRow{border-top:1px solid #e3e5e9}
.assetDetails{flex:1;min-width:0}
.assetDetails strong{display:block;overflow-wrap:anywhere}
.assetCategory{font-size:11px;color:#777;margin-top:3px}
.assetNumbers{font-size:12px;color:#777;margin-top:5px;line-height:1.6}
.assetValue{font-weight:700;text-align:right;overflow-wrap:anywhere}
.sectionMarker{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3978E8;margin-right:7px;vertical-align:middle}
</style>
</head>
<body>
<div class="app">
  <div class="total">
    <div class="label">PATRIMONIO TOTALE</div>
    <div class="amount" id="total">€ 0,00</div>
  </div>

  <h2>I miei conti</h2>
  <div id="accounts"></div>

  <div class="form" id="accountDetail">
    <h2 id="detailName">Dettagli conto</h2>
    <div class="label">SALDO ATTUALE</div>
    <div class="detailBalance" id="detailBalance">€ 0,00</div>

    <div class="composition">
      <div class="compositionTitle"><span class="sectionMarker"></span>LIQUIDITÀ</div>
      <div class="compositionRow">
        <span>Disponibilità</span>
        <strong id="detailLiquidity">€ 0,00</strong>
      </div>
    </div>

    <div class="composition">
      <div class="compositionTitle"><span class="sectionMarker"></span>INVESTIMENTI</div>
      <div id="detailInvestments"></div>
    </div>

    <button class="add transfer" onclick="openInternalTransfer()">⇄ Trasferisci in investimenti</button>

    <div class="detailActions">
      <button onclick="editSelectedAccount()">Modifica</button>
      <button class="delete" onclick="deleteSelectedAccount()">Elimina</button>
    </div>
    <div class="formbuttons">
      <button class="cancel" onclick="closeAccountDetail()">Chiudi</button>
    </div>
  </div>

  <button class="add" onclick="newAccount()">+ Aggiungi un conto</button>
  <button class="add income" onclick="openIncome()">+ Aggiungi movimento</button>
  <button class="add transfer" onclick="openTransfer()">⇄ Trasferisci tra conti</button>

  <div class="form" id="transferForm">
    <h2>Trasferimento</h2>

    <label for="from">Da quale conto</label>
    <select id="from"></select>

    <label for="to">A quale conto</label>
    <select id="to"></select>

    <label for="transferAmount">Importo da trasferire (€)</label>
    <input id="transferAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00">

    <div class="formbuttons">
      <button class="cancel" onclick="closeTransfer()">Annulla</button>
      <button class="save" onclick="saveTransfer()">Trasferisci</button>
    </div>
  </div>

  <div class="form" id="internalTransferForm">
    <h2 id="internalTransferTitle">Trasferimento in investimenti</h2>

    <label for="investmentCategory">Categoria</label>
    <select id="investmentCategory" onchange="handleCategoryChange()"></select>

    <label for="investmentName">Nome dell'investimento</label>
    <input id="investmentName" maxlength="50" placeholder="Es. BTC, Apple">

    <label for="internalTransferAmount">Importo investito (€)</label>
    <input id="internalTransferAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00">

    <label for="investmentQuantity">Quantità acquistata (facoltativa)</label>
    <input id="investmentQuantity" type="number" inputmode="decimal" min="0.00000001" step="any" placeholder="Es. 3">

    <label for="investmentUnitPrice">Prezzo unitario (€) (facoltativo)</label>
    <input id="investmentUnitPrice" type="number" inputmode="decimal" min="0.00000001" step="any" placeholder="Es. 200">

    <div class="formbuttons">
      <button class="cancel" onclick="closeInternalTransfer()">Annulla</button>
      <button class="save" onclick="saveInternalTransfer()">Trasferisci</button>
    </div>
  </div>

  <div class="form" id="incomeForm">
    <h2>Nuovo movimento</h2>

    <label for="movementType">Tipo di movimento</label>
    <select id="movementType">
      <option value="income">Entrata</option>
      <option value="expense">Uscita</option>
    </select>

    <label for="incomeAccount">Su quale conto</label>
    <select id="incomeAccount"></select>

    <label for="incomeAmount">Importo (€)</label>
    <input id="incomeAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00">

    <label for="incomeDescription">Descrizione</label>
    <input id="incomeDescription" maxlength="80" placeholder="Es. Stipendio, spesa, bolletta">

    <div class="formbuttons">
      <button class="cancel" onclick="closeIncome()">Annulla</button>
      <button class="save" onclick="saveIncome()">Salva movimento</button>
    </div>
  </div>

  <div class="history">
    <div class="historyHead">
      <h2>Ultimi movimenti</h2>
      <button class="more" id="showMore" onclick="toggleTransfers()">Mostra altro</button>
    </div>
    <div id="transferHistory"></div>
  </div>

  <div class="form" id="form">
    <h2 id="formTitle">Nuovo conto</h2>
    <label for="name">Nome del conto</label>
    <input id="name" placeholder="Es. Intesa, Poste, Contanti" maxlength="50">

    <label for="balance">Saldo attuale (€)</label>
    <input id="balance" type="number" inputmode="decimal" step="0.01" placeholder="0,00">

    <label>Colore del conto</label>
    <div class="colors" id="colors"></div>

    <div class="formbuttons">
      <button class="cancel" onclick="closeForm()">Annulla</button>
      <button class="save" onclick="saveAccount()">Salva</button>
    </div>
  </div>
</div>

<script>
const palette = [
  "#3978E8","#18A779","#9659D8","#F19A38",
  "#E05260","#16A6B6","#6B7280","#D3A72F"
];

const defaultInvestmentCategories = [
  "Azioni","Criptovalute","ETF","Obbligazioni","Altro"
];

let investmentCategories = [...defaultInvestmentCategories];
let accounts = [];
let transfers = [];
let incomes = [];
let editingId = null;
let selectedAccountId = null;
let internalTransferAccountId = null;
let selectedColor = palette[0];
let showAllTransfers = false;

try {
  accounts = JSON.parse(localStorage.getItem("rendiconto_conti")) || [];
  if (!Array.isArray(accounts)) accounts = [];
} catch (e) {
  accounts = [];
}

try {
  transfers = JSON.parse(localStorage.getItem("rendiconto_trasferimenti")) || [];
  if (!Array.isArray(transfers)) transfers = [];
} catch (e) {
  transfers = [];
}

try {
  incomes = JSON.parse(localStorage.getItem("rendiconto_entrate")) || [];
  if (!Array.isArray(incomes)) incomes = [];
} catch (e) {
  incomes = [];
}

try {
  const savedCategories = JSON.parse(localStorage.getItem("rendiconto_categorie_investimenti")) || [];
  if (Array.isArray(savedCategories)) {
    investmentCategories = [...new Set([...defaultInvestmentCategories, ...savedCategories])];
  }
} catch (e) {
  investmentCategories = [...defaultInvestmentCategories];
}

function investmentTotal(account) {
  return (account.investments || []).reduce(
    (sum, investment) => sum + (Number(investment.value) || 0), 0
  );
}

function updateAccountBalance(account) {
  account.liquidity = Math.round((Number(account.liquidity) || 0) * 100) / 100;
  account.balance = Math.round((account.liquidity + investmentTotal(account)) * 100) / 100;
}

accounts.forEach(account => {
  if (!Array.isArray(account.investments)) {
    account.investments = [];
  }

  if (account.liquidity === undefined || account.liquidity === null) {
    account.liquidity = (Number(account.balance) || 0) - investmentTotal(account);
  }

  account.investments.forEach(investment => {
    if (investment.costBasis === undefined || investment.costBasis === null) {
      investment.costBasis = Number(investment.value) || 0;
    }
    if (investment.quantity === undefined || investment.quantity === null) {
      investment.quantity = null;
    }
    if (!investment.category) {
      investment.category = "Altro";
    }
    if (investment.averagePrice === undefined || investment.averagePrice === null) {
      const quantity = Number(investment.quantity);
      investment.averagePrice = quantity > 0
        ? Number(investment.costBasis) / quantity
        : null;
    }
  });

  updateAccountBalance(account);
});

const euro = value => Number(value).toLocaleString("it-IT", {
  style:"currency", currency:"EUR"
});

function persist() {
  accounts.forEach(updateAccountBalance);
  localStorage.setItem("rendiconto_conti", JSON.stringify(accounts));
  localStorage.setItem("rendiconto_trasferimenti", JSON.stringify(transfers));
  localStorage.setItem("rendiconto_entrate", JSON.stringify(incomes));
  localStorage.setItem("rendiconto_categorie_investimenti", JSON.stringify(investmentCategories));
  render();
}

function render() {
  document.getElementById("total").textContent =
    euro(accounts.reduce((sum, a) => sum + (Number(a.balance) || 0), 0));

  const container = document.getElementById("accounts");
  container.innerHTML = "";

  if (!accounts.length) {
    container.innerHTML =
      '<div class="empty">Aggiungi il tuo primo conto per iniziare.</div>';
  }

  accounts.forEach(a => {
    const card = document.createElement("div");
    card.className = "account";
    card.onclick = () => openAccountDetail(a.id);

    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.background = a.color;

    const details = document.createElement("div");
    details.className = "details";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = a.name;

    const balance = document.createElement("div");
    balance.className = "balance";
    balance.textContent = euro(a.balance);

    details.append(name, balance);
    card.append(dot, details);
    container.append(card);
  });

  renderTransfers();
}

function openAccountDetail(id) {
  closeForm();
  closeTransfer();
  closeInternalTransfer();
  closeIncome();

  const account = accounts.find(a => a.id === id);
  if (!account) return;

  selectedAccountId = id;
  document.getElementById("detailName").textContent = account.name;
  document.getElementById("detailBalance").textContent = euro(account.balance);
  document.getElementById("detailLiquidity").textContent = euro(account.liquidity);

  const investmentContainer = document.getElementById("detailInvestments");
  investmentContainer.innerHTML = "";

  if (!account.investments.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Nessun investimento.";
    investmentContainer.append(empty);
  } else {
    account.investments.forEach(investment => {
      const row = document.createElement("div");
      row.className = "assetRow";

      const details = document.createElement("div");
      details.className = "assetDetails";

      const name = document.createElement("strong");
      name.textContent = investment.name;

      const category = document.createElement("div");
      category.className = "assetCategory";
      category.textContent = investment.category || "Altro";

      details.append(name, category);

      const quantity = Number(investment.quantity);
      const averagePrice = Number(investment.averagePrice);
      const numbers = document.createElement("div");
      numbers.className = "assetNumbers";

      if (Number.isFinite(quantity) && quantity > 0) {
        numbers.textContent = "Quantità: " + quantity.toLocaleString("it-IT", {
          maximumFractionDigits: 8
        });

        if (Number.isFinite(averagePrice) && averagePrice > 0) {
          numbers.textContent += " · Prezzo medio: " + euro(averagePrice);
        }
      } else {
        numbers.textContent = "Quantità e prezzo medio non disponibili";
      }

      details.append(numbers);

      const value = document.createElement("div");
      value.className = "assetValue";
      value.textContent = euro(investment.value);

      row.append(details, value);
      investmentContainer.append(row);
    });
  }

  document.getElementById("accountDetail").style.display = "block";
  document.getElementById("accountDetail").scrollIntoView({behavior:"smooth"});
}

function closeAccountDetail() {
  document.getElementById("accountDetail").style.display = "none";
  selectedAccountId = null;
}

function editSelectedAccount() {
  if (selectedAccountId === null) return;

  const id = selectedAccountId;
  closeAccountDetail();
  editAccount(id);
}

function deleteSelectedAccount() {
  if (selectedAccountId === null) return;

  const id = selectedAccountId;
  closeAccountDetail();
  deleteAccount(id);
}

function renderTransfers() {
  const container = document.getElementById("transferHistory");
  const button = document.getElementById("showMore");
  container.innerHTML = "";

  const movements = [
    ...transfers.map(t => ({...t, type:"transfer"})),
    ...incomes.map(i => ({...i, type:i.type || "income"}))
  ];

  movements.sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));

  button.style.display = movements.length > 5 ? "block" : "none";
  button.textContent = showAllTransfers ? "Mostra meno" : "Mostra altro";

  const visible = showAllTransfers ? movements : movements.slice(0, 5);

  if (!visible.length) {
    container.innerHTML =
      '<div class="empty">Non hai ancora effettuato movimenti.</div>';
    return;
  }

  visible.forEach(m => {
    const row = document.createElement("div");
    row.className = "transferRow";

    const left = document.createElement("div");
    left.className = "transferName";

    const middle = document.createElement("div");
    middle.className = "transferMiddle";

    const amount = document.createElement("span");
    amount.className = "transferAmount";

    const right = document.createElement("div");
    right.className = "transferName";
    right.style.textAlign = "right";

    if (m.type === "transfer") {
      left.textContent = m.fromName;
      left.style.color = m.fromColor;

      amount.textContent = "+ " + euro(m.amount);

      right.textContent = m.toName;
      right.style.color = m.toColor;

      if (m.assetName) {
        const asset = document.createElement("span");
        asset.className = "assetName";
        asset.textContent = m.assetName;
        middle.append(amount, asset);
      } else {
        middle.append(amount);
      }
    } else {
      left.textContent = m.description || "Entrata";
      left.style.color = m.type === "expense" ? "#E05260" : "#18A779";

      amount.textContent =
        (m.type === "expense" ? "− " : "+ ") + euro(m.amount);

      right.textContent = m.accountName;
      right.style.color = m.accountColor;
      middle.append(amount);
    }

    const date = document.createElement("div");
    date.className = "movementDate";
    date.textContent = m.date
      ? new Date(m.date).toLocaleDateString("it-IT")
      : "Data non disponibile";

    left.append(date);
    row.append(left, middle, right);
    container.append(row);
  });
}

function toggleTransfers() {
  showAllTransfers = !showAllTransfers;
  renderTransfers();
}

function renderColors() {
  const container = document.getElementById("colors");
  container.innerHTML = "";

  palette.forEach(color => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "color" +
      (selectedColor === color ? " selected" : "");
    button.style.background = color;
    button.setAttribute("aria-label", "Seleziona colore");
    button.setAttribute("aria-pressed", selectedColor === color);
    button.onclick = () => {
      selectedColor = color;
      renderColors();
    };
    container.append(button);
  });
}

function renderInvestmentCategories(selected) {
  const select = document.getElementById("investmentCategory");
  select.innerHTML = "";

  investmentCategories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    select.append(option);
  });

  const createOption = document.createElement("option");
  createOption.value = "__new_category__";
  createOption.textContent = "＋ Crea nuova categoria";
  select.append(createOption);

  select.value = investmentCategories.includes(selected) ? selected : "Altro";
}

function handleCategoryChange() {
  const select = document.getElementById("investmentCategory");

  if (select.value !== "__new_category__") return;

  const category = prompt("Nome della nuova categoria:");
  const name = category ? category.trim() : "";

  if (!name) {
    select.value = "Altro";
    return;
  }

  const existing = investmentCategories.find(
    item => item.toLocaleLowerCase("it-IT") === name.toLocaleLowerCase("it-IT")
  );

  if (existing) {
    select.value = existing;
    return;
  }

  investmentCategories.push(name);
  localStorage.setItem("rendiconto_categorie_investimenti", JSON.stringify(investmentCategories));
  renderInvestmentCategories(name);
}

function newAccount() {
  closeAccountDetail();
  closeTransfer();
  closeInternalTransfer();
  closeIncome();
  editingId = null;
  selectedColor = palette[accounts.length % palette.length];
  document.getElementById("formTitle").textContent = "Nuovo conto";
  document.getElementById("name").value = "";
  document.getElementById("balance").value = "";
  renderColors();
  document.getElementById("form").style.display = "block";
  document.getElementById("name").focus();
}

function editAccount(id) {
  closeAccountDetail();
  closeTransfer();
  closeInternalTransfer();
  closeIncome();

  const a = accounts.find(item => item.id === id);
  if (!a) return;

  editingId = id;
  selectedColor = a.color;
  document.getElementById("formTitle").textContent = "Modifica conto";
  document.getElementById("name").value = a.name;
  document.getElementById("balance").value = a.balance;
  renderColors();
  document.getElementById("form").style.display = "block";
  document.getElementById("form").scrollIntoView({behavior:"smooth"});
}

function saveAccount() {
  const name = document.getElementById("name").value.trim();
  const rawBalance = document.getElementById("balance").value.trim();

  if (!name) {
    alert("Inserisci il nome del conto.");
    return;
  }

  if (rawBalance === "" || !Number.isFinite(Number(rawBalance))) {
    alert("Inserisci un saldo valido.");
    return;
  }

  const balance = Number(rawBalance);

  if (editingId !== null) {
    const a = accounts.find(item => item.id === editingId);
    if (a) {
      a.name = name;
      a.liquidity = Math.round((balance - investmentTotal(a)) * 100) / 100;
      a.color = selectedColor;
      updateAccountBalance(a);
    }
  } else {
    accounts.push({
      id: Date.now().toString() + Math.random().toString(16).slice(2),
      name,
      balance,
      liquidity: balance,
      investments: [],
      color: selectedColor
    });
  }

  persist();
  closeForm();
}

function deleteAccount(id) {
  const a = accounts.find(item => item.id === id);
  if (!a) return;

  if (confirm('Vuoi eliminare il conto "' + a.name + '"?')) {
    accounts = accounts.filter(item => item.id !== id);
    persist();
  }
}

function closeForm() {
  document.getElementById("form").style.display = "none";
  editingId = null;
}

function openTransfer() {
  closeForm();
  closeAccountDetail();
  closeInternalTransfer();
  closeIncome();

  if (accounts.length < 2) {
    alert("Devi avere almeno due conti per effettuare un trasferimento.");
    return;
  }

  const from = document.getElementById("from");
  const to = document.getElementById("to");
  from.innerHTML = "";
  to.innerHTML = "";

  accounts.forEach(a => {
    const optionFrom = document.createElement("option");
    optionFrom.value = a.id;
    optionFrom.textContent = a.name + " (Liquidità: " + euro(a.liquidity) + ")";
    from.append(optionFrom);

    const optionTo = document.createElement("option");
    optionTo.value = a.id;
    optionTo.textContent = a.name;
    to.append(optionTo);
  });

  to.selectedIndex = 1;
  document.getElementById("transferAmount").value = "";
  document.getElementById("transferForm").style.display = "block";
  document.getElementById("transferForm").scrollIntoView({behavior:"smooth"});
}

function saveTransfer() {
  const fromId = document.getElementById("from").value;
  const toId = document.getElementById("to").value;
  const rawAmount = document.getElementById("transferAmount").value.trim();
  const amount = Math.round(Number(rawAmount) * 100) / 100;

  if (fromId === toId) {
    alert("Scegli due conti diversi.");
    return;
  }

  if (rawAmount === "" || !Number.isFinite(amount) || amount <= 0) {
    alert("Inserisci un importo valido.");
    return;
  }

  const from = accounts.find(a => a.id === fromId);
  const to = accounts.find(a => a.id === toId);

  if (!from || !to) {
    alert("Seleziona due conti validi.");
    return;
  }

  if (Math.round(Number(from.liquidity) * 100) < Math.round(amount * 100)) {
    alert("Liquidità insufficiente nel conto di partenza.");
    return;
  }

  from.liquidity = Math.round((Number(from.liquidity) - amount) * 100) / 100;
  to.liquidity = Math.round((Number(to.liquidity) + amount) * 100) / 100;
  updateAccountBalance(from);
  updateAccountBalance(to);

  transfers.unshift({
    fromName: from.name,
    fromColor: from.color,
    toName: to.name,
    toColor: to.color,
    amount: amount,
    date: Date.now()
  });

  persist();
  closeTransfer();
}

function closeTransfer() {
  document.getElementById("transferForm").style.display = "none";
}

function openInternalTransfer() {
  if (selectedAccountId === null) return;

  const account = accounts.find(a => a.id === selectedAccountId);
  if (!account) return;

  closeForm();
  closeTransfer();
  closeIncome();

  internalTransferAccountId = account.id;
  document.getElementById("internalTransferTitle").textContent =
    "Trasferimento da " + account.name + " agli investimenti";
  document.getElementById("investmentName").value = "";
  document.getElementById("internalTransferAmount").value = "";
  document.getElementById("investmentQuantity").value = "";
  document.getElementById("investmentUnitPrice").value = "";
  renderInvestmentCategories("Azioni");
  document.getElementById("internalTransferForm").style.display = "block";
  document.getElementById("internalTransferForm").scrollIntoView({behavior:"smooth"});
}

function saveInternalTransfer() {
  const account = accounts.find(a => a.id === internalTransferAccountId);
  if (!account) {
    alert("Seleziona un conto valido.");
    return;
  }

  const assetName = document.getElementById("investmentName").value.trim();
  const category = document.getElementById("investmentCategory").value;
  const rawAmount = document.getElementById("internalTransferAmount").value.trim();
  const rawQuantity = document.getElementById("investmentQuantity").value.trim();
  const rawPrice = document.getElementById("investmentUnitPrice").value.trim();
  const amount = Math.round(Number(rawAmount) * 100) / 100;

  if (!assetName) {
    alert("Inserisci il nome dell'investimento.");
    return;
  }

  if (!category || category === "__new_category__") {
    alert("Seleziona una categoria valida.");
    return;
  }

  if (rawAmount === "" || !Number.isFinite(amount) || amount <= 0) {
    alert("Inserisci un importo valido.");
    return;
  }

  let quantity = null;
  let unitPrice = null;

  if (rawQuantity !== "") {
    quantity = Number(rawQuantity);
    if (!Number.isFinite(quantity) || quantity <= 0) {
      alert("Inserisci una quantità valida.");
      return;
    }
  }

  if (rawPrice !== "") {
    unitPrice = Number(rawPrice);
    if (!Number.isFinite(unitPrice) || unitPrice <= 0) {
      alert("Inserisci un prezzo unitario valido.");
      return;
    }
  }

  if (quantity === null && unitPrice !== null) {
    quantity = amount / unitPrice;
  } else if (quantity !== null && unitPrice === null) {
    unitPrice = amount / quantity;
  } else if (quantity !== null && unitPrice !== null) {
    const calculatedAmount = quantity * unitPrice;
    if (Math.abs(calculatedAmount - amount) > 0.02) {
      alert("L'importo investito deve corrispondere alla quantità moltiplicata per il prezzo unitario.");
      return;
    }
    unitPrice = amount / quantity;
  }

  if (Math.round(Number(account.liquidity) * 100) < Math.round(amount * 100)) {
    alert("Liquidità insufficiente nel conto selezionato.");
    return;
  }

  account.liquidity = Math.round((Number(account.liquidity) - amount) * 100) / 100;

  let investment = account.investments.find(
    item => item.name.toLocaleLowerCase("it-IT") === assetName.toLocaleLowerCase("it-IT")
  );

  if (investment) {
    const oldCostBasis = Number(investment.costBasis ?? investment.value) || 0;
    const oldQuantity = Number(investment.quantity) || 0;

    investment.value = Math.round((Number(investment.value) + amount) * 100) / 100;
    investment.costBasis = Math.round((oldCostBasis + amount) * 100) / 100;
    investment.category = category;

    if (quantity !== null) {
      investment.quantity = oldQuantity + quantity;
    } else if (oldQuantity > 0) {
      investment.quantity = oldQuantity;
    }

    if (Number(investment.quantity) > 0) {
      investment.averagePrice = investment.costBasis / Number(investment.quantity);
    } else {
      investment.averagePrice = null;
    }
  } else {
    investment = {
      name: assetName,
      category: category,
      value: amount,
      costBasis: amount,
      quantity: quantity,
      averagePrice: quantity !== null && quantity > 0 ? amount / quantity : null
    };
    account.investments.push(investment);
  }

  updateAccountBalance(account);

  transfers.unshift({
    fromName: account.name,
    fromColor: account.color,
    toName: account.name,
    toColor: account.color,
    amount: amount,
    assetName: assetName,
    internal: true,
    date: Date.now()
  });

  persist();
  closeInternalTransfer();
  openAccountDetail(account.id);
}

function closeInternalTransfer() {
  document.getElementById("internalTransferForm").style.display = "none";
  internalTransferAccountId = null;
}

function openIncome() {
  closeForm();
  closeTransfer();
  closeInternalTransfer();
  closeAccountDetail();

  if (!accounts.length) {
    alert("Devi prima aggiungere almeno un conto.");
    return;
  }

  const select = document.getElementById("incomeAccount");
  select.innerHTML = "";

  accounts.forEach(a => {
    const option = document.createElement("option");
    option.value = a.id;
    option.textContent = a.name + " (Liquidità: " + euro(a.liquidity) + ")";
    select.append(option);
  });

  document.getElementById("movementType").value = "income";
  document.getElementById("incomeAmount").value = "";
  document.getElementById("incomeDescription").value = "";
  document.getElementById("incomeForm").style.display = "block";
  document.getElementById("incomeForm").scrollIntoView({behavior:"smooth"});
}

function saveIncome() {
  const accountId = document.getElementById("incomeAccount").value;
  const rawAmount = document.getElementById("incomeAmount").value.trim();
  const amount = Math.round(Number(rawAmount) * 100) / 100;
  const description =
    document.getElementById("incomeDescription").value.trim();
  const type = document.getElementById("movementType").value;

  if (rawAmount === "" || !Number.isFinite(amount) || amount <= 0) {
    alert("Inserisci un importo valido.");
    return;
  }

  const account = accounts.find(a => a.id === accountId);

  if (!account) {
    alert("Seleziona un conto valido.");
    return;
  }

  if (type === "expense" &&
      Math.round(Number(account.liquidity) * 100) < Math.round(amount * 100)) {
    alert("Liquidità insufficiente nel conto selezionato.");
    return;
  }

  const change = type === "expense" ? -amount : amount;

  account.liquidity =
    Math.round((Number(account.liquidity) + change) * 100) / 100;
  updateAccountBalance(account);

  incomes.unshift({
    type: type,
    accountName: account.name,
    accountColor: account.color,
    description: description || (type === "expense" ? "Uscita" : "Entrata"),
    amount: amount,
    date: Date.now()
  });

  persist();
  closeIncome();
}

function closeIncome() {
  document.getElementById("incomeForm").style.display = "none";
}

render();
</script>
